guide:
  - id: direction
    title: Start with the kind of work you want to do
    text: "Decide what you want from graduate school: deeper technical training, a research career, or preparation for industry. Compare the research
      component, length, and funding model of each specific degree rather than assuming every master’s or PhD works the same way."
  - id: shortlist
    title: Build a shortlist around fit
    text: Start with research questions, faculty, and recent papers. Then compare curriculum, advising structure, total cost, funding, location,
      and outcomes. Use ambitious and more attainable options to diversify the list, without assigning admissions probabilities or treating any
      program as guaranteed.
  - id: evidence
    title: Make your research experience concrete
    text: For each project, explain the problem, your contribution, the decisions you made, and what you learned when an approach failed. Keep the
      CV concise and use project pages, code, papers, or posters to provide deeper evidence. Grades are one part of the record; avoid a universal
      cutoff rule.
  - id: letters
    title: Ask people who know your work
    text: Choose recommenders who can describe your research, coursework, teaching, or collaboration in detail. Ask early, confirm their availability,
      and share your CV, project summaries, target programs, and deadlines. Follow each application’s instructions for the number and submission
      of letters.
  - id: statement
    title: Write a specific statement of purpose
    text: Build a clear argument connecting your past work, current questions, and reasons for choosing the program. Explain faculty or lab fit
      using work you have actually read. Follow the program’s length and formatting instructions, and seek feedback on clarity and technical substance.
  - id: tests
    title: Check tests and logistics program by program
    text: Record the current test requirements, exemptions, score reporting rules, fees, and language requirements from the official admissions
      pages. Book only the tests you need. Keep transcripts, translations if requested, and portal instructions together.
  - id: timeline
    title: Work backward from your earliest deadline
    text: First identify suitable programs and request letters. Next prepare the CV and first statement draft, handle any required tests, and collect
      records. Leave time for feedback and tailored revisions, then verify every portal field and submission before the actual deadline. Use each
      program’s current dates and time zone.
checklist:
  - id: goals
    text: Write down your goals and preferred research areas
  - id: fit
    text: Create a shortlist with faculty fit and official program links
  - id: funding
    text: Record the cost, funding model, and eligibility of each option
  - id: requirements
    text: Verify current requirements, deadlines, and time zones
  - id: letters
    text: Confirm recommenders and share an organized briefing packet
  - id: cv
    text: Prepare a concise CV with evidence of your contributions
  - id: sop
    text: Draft and tailor the statement for each program
  - id: records
    text: Collect transcripts and any required test reports
  - id: review
    text: Get feedback and review the final application
  - id: submit
    text: Submit and confirm receipt of required materials

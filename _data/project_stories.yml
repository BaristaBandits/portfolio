logits:
  question: What do a language model’s next-token scores look like when we sort them?
  context: With Aravind Ramana Venkatramanan and Nambi Seshadri
  plain: A model scores every possible next token. Sorting those scores reveals a remarkably regular curve. The interesting part is how training
    changes its slope.
  steps:
    - title: Score
      text: At a prediction step, collect the vocabulary-sized vector of scores before softmax.
    - title: Rank
      text: Sort the scores from largest to smallest, then examine score against log rank.
    - title: Separate
      text: Compare trained models with random order-statistic baselines to distinguish generic shape from learned structure.
  finding: The vocabulary head is approximately log-linear. Trained slopes around 1.4–1.7 exceed the initialization baseline around 0.2; slope
    also correlates with predictive performance.
  limit: The relation is an empirical approximation of the vocabulary head. Correlation with prediction quality does not establish a causal mechanism.
  figure: logit-spectrum.png
  caption: "Figure 1(a): ordered logits and a fitted log-linear curve for a Llama-3.2-1B context."
  source: https://arxiv.org/html/2610.18520v1#S3.F1
  paper: https://arxiv.org/abs/2610.18520
  pdf: https://arxiv.org/pdf/2610.18520
  paper_title: "The Geometry of Language Model Logits: Generic Structure and Learned Departures"
  authors: Swathi Shree Narashiman, Aravind Ramana Venkatramanan, Nambi Seshadri
  venue: arXiv · October 2026
  demo: logits
  extra_figure:
    file: logit-collapse.png
    caption: "Figure 1(b): normalized spectra across 1,000 contexts for Llama-3.2-1B."
    source: https://arxiv.org/html/2610.18520v1#S3.F1
workflow:
  question: Can an agent remember a procedure instead of every attempt?
  context: Summer research internship · Fujitsu Research of India · with Ishan Jindal and Mahesh Chandran
  plain: Heating a mug and heating a bowl involve different objects, but share a procedure. We consolidate repeated experiences into reusable
    workflows instead of keeping every trajectory.
  steps:
    - title: Experience
      text: Collect the task, the agent’s interaction trajectory, and its outcome.
    - title: Consolidate
      text: Merge reusable environment knowledge, procedural steps, and failure guidance into the task family’s workflow.
    - title: Reuse
      text: Retrieve the corresponding workflow for the next task. The model’s weights remain fixed; learning happens in external memory.
  finding: Across the reported settings, workflow memory uses 3.5× fewer tokens on average (1.1–9.1×). Task performance is competitive on ALFWorld
    and ScienceWorld-Easy.
  limit: On ScienceWorld-Difficult with GPT-5.1-mini, workflow memory underperforms both trajectory memory and the no-memory baseline. Compression
    does not preserve every useful detail.
  figure: workflow-overview.png
  caption: "Figure 1: individual trajectories are consolidated into workflows containing environment knowledge, a procedure, and failure guidance."
  source: https://aclanthology.org/2026.realm-1.78.pdf#page=2
  paper: https://aclanthology.org/2026.realm-1.78/
  pdf: https://aclanthology.org/2026.realm-1.78.pdf
  paper_title: "From Trajectories to Workflows: Online Procedural Memory Abstraction for Language Agents"
  authors: Swathi Shree Narashiman, Ishan Jindal, Mahesh Chandran
  venue: REALM 2026 · pages 1144–1159
  demo: workflow
smoothing:
  question: Can similar contexts lend each other statistical evidence?
  context: Bachelor’s thesis · IIT Madras · supervised by Prof. Andrew Thangaraj
  plain: A rare context has little evidence for what comes next. Semantic smoothing borrows evidence from nearby context embeddings, balancing
    local observations with similar distributions.
  steps:
    - title: Estimate
      text: Estimate a next-word distribution from the observations following a context.
    - title: Find neighbors
      text: Use embedding proximity to identify contexts expected to have similar next-word distributions.
    - title: Interpolate
      text: Mix the local estimate with neighboring distributions, guided by a distribution-estimation formulation under KL loss.
  finding: The paper derives an interpolation estimator with a minimax risk bound and evaluates semantic smoothing on synthetic Markov data and
    WikiText-103 bigram models. It improves test perplexity over the tested add-constant and Kneser–Ney estimates.
  limit: Embedding proximity implies KL proximity under the paper’s Lipschitz-logit assumptions. The natural-language experiments are bigram models,
    rather than a general claim about every neural language model.
  paper: https://arxiv.org/abs/2605.07994
  pdf: https://arxiv.org/pdf/2605.07994
  paper_title: Semantic Smoothing for Language Models via Distribution Estimation and Embeddings
  authors: Haricharan Balasundaram, Swathi Shree Narashiman, Pranay Mathur, Andrew Thangaraj
  venue: arXiv · May 2026
  code: https://github.com/BaristaBandits/Distribution_Estimation
  demo: smoothing
  materials:
    - title: Thesis report
      url: /assets/pdf/bachelor_thesis_report.pdf
    - title: Presentation slides
      url: /assets/pdf/bachelor_thesis_presentation.pdf
induction:
  question: Do induction heads merely count exact matches?
  context: Research internship · TML Lab, EPFL · with Prof. Nicolas Flammarion
  plain: Induction heads can reuse patterns from earlier in a sequence. On Markov-chain tasks, we show how they combine exact matches with partial
    matches and prior counts.
  steps:
    - title: Copy
      text: The first attention layer copies earlier tokens into representations of each position’s context.
    - title: Match
      text: The second layer compares contexts. Finite attention scale gives partial matches some weight, instead of discarding them.
    - title: Smooth
      text: Aggregate successor tokens across matches. A beginning-of-sequence token can additionally supply pseudo-counts.
  finding: The analysis connects soft context matching to interpolation across n-gram orders, and BOS behavior to additive smoothing. Trained
    models recover the predicted patterns on the studied Markov tasks.
  limit: The mechanisms are characterized in controlled Markov-chain settings and a disentangled transformer construction. These experiments do
    not characterize every induction circuit in a production LLM.
  figure: induction-circuit.png
  caption: "Figure 2: a two-layer circuit copies contexts, compares matches, and aggregates successor tokens."
  source: https://arxiv.org/html/2607.02800v1
  paper: https://arxiv.org/abs/2607.02800
  pdf: https://arxiv.org/pdf/2607.02800
  paper_title: Induction Heads Interpolate N-Grams
  authors: Francesco D’Angelo, Oguz Kaan Yuksel, Swathi Shree Narashiman, Nicolas Flammarion
  venue: ICML 2026
  materials:
    - title: Presentation slides
      url: /assets/pdf/presentation.pdf
alphazip:
  question: Can a good next-token predictor help compress text?
  context: IIT Madras · with Prof. Nitin Chandrachoodan
  plain: If a model frequently ranks the actual next token near the top, its sequence of ranks becomes easier to compress. AlphaZip passes that
    rank sequence to a conventional lossless compressor.
  steps:
    - title: Predict
      text: For each token, use a language model to rank possible continuations.
    - title: Encode ranks
      text: Replace the token with its position in the model’s predicted ordering, then compress those ranks with a standard compressor.
    - title: Recover
      text: Use the same model and preceding context to reconstruct the ordering and recover the token at each stored rank.
  finding: The experiments compare neural prediction plus rank compression with information-theoretic baselines, and explore the effects of model
    choice, domain fine-tuning, and inference acceleration.
  limit: Compression comes with neural inference costs. Encoder and decoder must agree on the model, tokenizer, context, and rank ordering to
    recover the original tokens.
  figure: alphazip-architecture.png
  caption: "Figure 2: AlphaZip’s high-level prediction and compression architecture."
  source: https://arxiv.org/html/2409.15046v1
  paper: https://arxiv.org/abs/2409.15046
  pdf: https://arxiv.org/pdf/2409.15046
  paper_title: "AlphaZip: Neural Network-Enhanced Lossless Text Compression"
  authors: Swathi Shree Narashiman, Nitin Chandrachoodan
  venue: arXiv · September 2024
music:
  question: Can we guide a music model from inside its activations?
  context: AI Club · IIT Madras
  plain: "A prompt is one way to control generated music. This project explores another: intervening in MusicGen’s internal activations to influence
    genre during generation."
  steps:
    - title: Observe
      text: Collect internal representations associated with musical genres.
    - title: Probe
      text: Train a linear probe on the residual stream to identify genre-related directions.
    - title: Steer
      text: Use the probe’s weights for inference-time interventions, then listen to the resulting audio on the project demo.
  finding:
    The revised paper focuses on genre control through residual-stream steering. Its genre activation similarity matrix helps inspect relationships
    among the learned directions.
  limit: The figure describes relationships between activations; it is not a listening-quality score. The examples and evaluation in the paper
    provide the evidence for the intervention.
  figure: music-genres.png
  caption: "Figure 1 from the revised paper: Jaccard similarity among genre activations."
  source: https://arxiv.org/html/2506.10225v2
  paper: https://arxiv.org/abs/2506.10225
  pdf: https://arxiv.org/pdf/2506.10225
  paper_title: Genre Controlled Music Generation via Activation Steering
  authors: Swathi Narashiman, Pranay Mathur, Dipanshu Panda, Jayden Koshy Joe, Harshith M R, Anish Veerakumar, Aniruddh Krishna, Keerthiharan
    A
  venue: arXiv 2025 · revised May 2026
  demo_url: https://controllable-genre-fusion.github.io/
radar:
  question: Can sparse radar reflections reveal an object’s 3D shape?
  context: Summer@EPFL · SENS Lab · with Prof. Haitham Hassanieh
  plain: Radar returns are sparse and depend strongly on reflecting surfaces. RFconstruct combines sensing, temporal fusion, and a reconstruction
    network to recover more complete object shapes.
  steps:
    - title: Sense
      text: Fuse measurements from two radars oriented in orthogonal planes to recover complementary spatial information.
    - title: Accumulate
      text: Align observations over time with odometry-aware temporal fusion to densify the input point cloud.
    - title: Reconstruct
      text: Use a customized encoder and local-global decoder to infer coarse and fine 3D object structure.
  finding: The paper reports radar-only shape reconstruction for driving objects, including cars, bikes, and pedestrians, and compares the outputs
    with baseline reconstructions and ground truth.
  limit: The result depends on the sensing setup, alignment, and learned reconstruction priors. A completed point cloud includes inferred structure
    beyond the directly observed radar returns.
  figure: radar-overview.png
  caption: "Figure 1: sparse radar input, baseline completion, RFconstruct, and ground truth."
  source: https://bmva-archive.org.uk/bmvc/2025/assets/papers/Paper_399/paper.pdf#page=2
  paper: https://bmva-archive.org.uk/bmvc/2025/assets/papers/Paper_399/paper.pdf
  pdf: https://bmva-archive.org.uk/bmvc/2025/assets/papers/Paper_399/paper.pdf
  paper_title: 3D Shape Reconstruction from Autonomous Driving Radars
  authors: Samah Hussein, Junfeng Guan, Swathi Shree Narashiman, Saurabh Gupta, Haitham Hassanieh
  venue: BMVC 2025
robustness:
  question: How do perturbations to logits change generated text?
  context: Undergraduate research · IIT Madras · with Prof. Nambi Seshadri and Prof. Srikrishna Bhashyam
  plain: This project studies how perturbations in a model’s output scores affect decoding and subsequent text, drawing connections with noisy
    communication channels.
  steps:
    - title: Perturb
      text: Introduce controlled changes to model logits.
    - title: Decode
      text: Compare the response under greedy decoding and nucleus sampling.
    - title: Analyze
      text: Study error propagation and the connection between decoding behavior and output uncertainty.
  finding: This project examines robustness and hallucination mechanisms through logit-space interventions. The related geometry paper studies
    the structure of these scores; it is linked as related reading rather than presented as this project’s publication.
  limit: These are related research directions, but studying logit geometry does not by itself establish an adversarial-robustness result.
  related_paper: https://arxiv.org/abs/2610.18520
  related_title: The Geometry of Language Model Logits
